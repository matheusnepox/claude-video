<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>Anúncio — Serviços avulsos de tráfego pago</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" />
<script src="vendor/gsap.min.js"></script>
<script src="studio.js"></script>
<style>
  :root { --verde: #07583F; --profundo: #043D2D; --branco: #FFFFFF; --claro: #DCEBE3; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--verde); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--verde);
    font-family: 'Instrument Sans', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  video.tela { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1080" data-height="1920">
  <audio id="trilha" src="assets/trilha-com-voz.wav" data-start="0" data-duration="45" data-track-index="9" data-volume="1"></audio>
  <video id="vFolhetos" class="tela" src="media/folhetos.mp4" muted playsinline data-start="5.6" data-duration="13" data-media-start="0"></video>
  <video id="vLona" class="tela" src="media/lona.mp4" muted playsinline data-start="5.6" data-duration="13" data-media-start="0"></video>
  <video id="vAcm" class="tela" src="media/acm.mp4" muted playsinline data-start="18.2" data-duration="6.2" data-media-start="0"></video>
</div>
<script src="js/logo-dados.js"></script>
<script src="js/marca.js"></script>
<script src="js/cena.js"></script>

</html>
