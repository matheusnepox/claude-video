  #lista .it.on .cx { background: var(--ok); border-color: var(--ok); }

<script>
(function () {
  const S = STUDIO, P = PERSONAGENS, T = window.TEMPOS;
  THREE.ColorManagement.legacyMode = false;
  const $ = (id) => document.getElementById(id);
  const F = {}; for (const f of T.falas) F[f.id] = f;
  const L = (id) => F[id].t0, LE = (id) => F[id].t1;
  const W = (id, w) => { const p = F[id].palavras.find((x) => x.w.toLowerCase().replace(/[^\wà-ú-]/g, '').startsWith(w)); return p ? p.t : F[id].t0; };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const ease = (n) => S.ease(n);
  const seg = (t, t0, d, e) => (t < t0 ? 0 : S.seg(t, t0, d, e || 'power2.out'));
  const janela = (t, a, b, ent, sai) => seg(t, a, ent || 0.35, 'power2.out') - seg(t, b, sai || 0.35, 'power2.in');
  const pop = (t, t0, d) => (t < t0 ? 0 : S.seg(t, t0, d || 0.35, 'back.out(1.6)'));
  function mostra(el, p, base) { el.style.opacity = p > 0.001 ? 1 : 0; el.style.transform = (base || '') + ` scale(${0.85 + 0.15 * p})`; }

  function novoR(id) {
    const r = new THREE.WebGLRenderer({ canvas: $(id), antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setPixelRatio(1); r.setSize(1080, 1920, false); r.outputEncoding = THREE.sRGBEncoding;
    r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap; r.setClearColor(0x000000, 0); return r;
  }
  const rFundo = novoR('fundo'), rFrente = novoR('frente');
  const cena = new THREE.Scene(); cena.fog = new THREE.Fog(0xb8cbd8, 70, 240);
  const cam = new THREE.PerspectiveCamera(30, 1080 / 1920, 0.1, 600);
  const hemi = new THREE.HemisphereLight(0xd6e4f0, 0x55663a, 1.05); cena.add(hemi);
  const sol = new THREE.DirectionalLight(0xfff2e0, 1.15); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 80 }); sol.shadow.radius = 8; sol.shadow.bias = -0.0004;
  cena.add(sol, sol.target);
  const preench = new THREE.DirectionalLight(0xbfd2ff, 0.25); cena.add(preench);
  const fogoLuz = new THREE.PointLight(0xff9a4a, 0, 12, 2); cena.add(fogoLuz);

  const M = (c, ex) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 1 }, ex || {}));
  const bR = (pai, c, w, h, d, x, y, z, r) => { const m = new THREE.Mesh(P.geoArred(w, h, d, r == null ? 0.12 : r), M(c)); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; pai.add(m); return m; };
  const rng = S.rng(31);

  // ---------- mundo: grama, lago ao fundo, morros, árvores ----------
  const matGrama = M(0x6c8a44);
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(400, 70), matGrama); chao.rotation.x = -Math.PI / 2; chao.position.z = 5; chao.receiveShadow = true; cena.add(chao);
  const matAgua = M(0x4f7a92, { roughness: 0.45 });
  const lago = new THREE.Mesh(new THREE.PlaneGeometry(400, 300), matAgua); lago.rotation.x = -Math.PI / 2; lago.position.set(0, -0.08, -180); lago.receiveShadow = true; cena.add(lago);
  const matMorro = M(0x5e744c, { flatShading: true });
  for (const [x, z, w, h] of [[-80, -230, 120, 10], [60, -250, 140, 9], [160, -230, 120, 11], [-160, -240, 140, 9]]) { const m = new THREE.Mesh(new THREE.ConeGeometry(w / 2, h, 5, 1), matMorro); m.scale.z = 0.25; m.position.set(x, h / 2 - 0.4, z); cena.add(m); }
  function arvore(x, z, s, seca) {
    const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); cena.add(g);
    bR(g, seca ? 0x8a7a6a : 0x6b4a32, 0.7, 4, 0.7, 0, 2, 0, 0.12);
    if (!seca) { bR(g, 0x4f7a3c, 3.4, 2.4, 3.4, 0, 4.6, 0, 0.5); bR(g, 0x5c8a46, 2.4, 1.8, 2.4, 0.3, 6.0, 0.2, 0.45); }
    return g;
  }
  for (let i = 0; i < 26; i++) { const x = -60 + i * 6 + rng() * 3, z = -26 + rng() * 4; if (Math.abs(x - 20) < 10) continue; arvore(x, z, 0.9 + rng() * 0.5, false); }
  for (let i = 0; i < 60; i++) { const b = bR(cena, 0xa3b26a, 0.5, 0.5, 0.5, -40 + rng() * 120, 0.25, -18 + rng() * 34, 0.1); if (Math.abs(b.position.x) < 8 && b.position.z > -6) b.position.x += 16; }

  // barraca: prisma triangular arredondado, porta na frente (+z local)
  function barraca(cor) {
    const g = new THREE.Group(), w = 3.2, h = 2.3, d = 3.6;
    const ang = Math.atan2(h, w / 2), lado = Math.hypot(h, w / 2);
    for (const s of [-1, 1]) { const p = bR(g, cor, lado, 0.14, d, s * w / 4, h / 2, 0, 0.06); p.rotation.z = -s * ang; }
    const tri = new THREE.Shape(); tri.moveTo(-w / 2, 0); tri.lineTo(w / 2, 0); tri.lineTo(0, h); tri.closePath();
    const fundo = new THREE.Mesh(new THREE.ShapeGeometry(tri), M(cor)); fundo.position.z = -d / 2 + 0.02; fundo.rotation.y = Math.PI; g.add(fundo);
    const porta = new THREE.Shape(); porta.moveTo(-w / 2 + 0.1, 0); porta.lineTo(w / 2 - 0.1, 0); porta.lineTo(0, h - 0.15); porta.closePath();
    const fr = new THREE.Mesh(new THREE.ShapeGeometry(porta), M(0x2f4a5a)); fr.position.z = d / 2 - 0.05; g.add(fr);
    const ab = new THREE.Shape(); ab.moveTo(-0.55, 0); ab.lineTo(0.55, 0); ab.lineTo(0, 1.3); ab.closePath();
    const ent = new THREE.Mesh(new THREE.ShapeGeometry(ab), M(0x18242c)); ent.position.z = d / 2 - 0.03; g.add(ent);
    bR(g, 0x3b3b36, 3.8, 0.06, 4.2, 0, 0.03, 0, 0.02);
    g.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
    return g;
  }

  // ---------- base: platô (bom) e baixada (ruim) ----------
  const plato = bR(cena, 0x76944a, 12, 0.7, 10, 0, 0.35, -1, 0.35);
  const BASEY = 0.7;
  const BX = -10.5; // baixada
  bR(cena, 0x5a7a3a, 6, 0.25, 7, BX, -0.1, -1, 0.3);
  for (const [x, z, w, d] of [[BX - 4, -1, 2.2, 8], [BX, -5.4, 8, 2.2]]) bR(cena, 0x6c8a44, w, 1.0, d, x, 0.3, z, 0.6);
  const poca = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 7.4), M(0x5b86a0, { roughness: 0.3, transparent: true, opacity: 0.85 })); poca.rotation.x = -Math.PI / 2; poca.position.set(BX, 0.05, -1); cena.add(poca);
  const barracaBoa = barraca(0xe07a3a); cena.add(barracaBoa);
  const barracaRuim = barraca(0xe07a3a); cena.add(barracaRuim);
  // placa da área de barracas
  const placa = new THREE.Group(); placa.position.set(4.6, BASEY, 2.6); cena.add(placa);
  bR(placa, 0x6b4a32, 0.3, 2.4, 0.3, 0, 1.2, 0, 0.06); bR(placa, 0xb08a5a, 2.6, 1.3, 0.2, 0, 2.3, 0.1, 0.1);
  { const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d'); x.fillStyle = '#b08a5a'; x.fillRect(0, 0, 512, 256);
    x.fillStyle = '#2a2f45'; x.font = '900 64px Nunito, sans-serif'; x.textAlign = 'center'; x.fillText('ÁREA DE', 256, 105); x.fillText('BARRACAS', 256, 185);
    const tx = new THREE.CanvasTexture(c); tx.encoding = THREE.sRGBEncoding; placa.userData.tex = tx; placa.userData.cv = c;
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.15), new THREE.MeshStandardMaterial({ map: tx, roughness: 1 })); pl.position.set(0, 2.3, 0.215); placa.add(pl); }
  // pedras, gravetos, formigueiro, toca, marimbondo (no lugar da barraca boa)
  const sujeira = [];
  for (let i = 0; i < 10; i++) { const pedra = i < 6; const m = bR(cena, pedra ? 0x8e8a80 : 0x6b4a32, pedra ? 0.45 : 1.1, pedra ? 0.3 : 0.12, pedra ? 0.4 : 0.12, -2.2 + rng() * 4, BASEY + 0.15, -3 + rng() * 4, 0.08); m.rotation.y = rng() * 3; sujeira.push({ m, x: m.position.x, z: m.position.z, a: rng() * 6.28 }); }
  const formig = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.9, 7), M(0xa0703a, { flatShading: true })); formig.position.set(-4.2, BASEY + 0.45, 1.6); formig.castShadow = true; cena.add(formig);
  const toca = new THREE.Mesh(new THREE.CircleGeometry(0.45, 20), M(0x1d1712)); toca.rotation.x = -Math.PI / 2; toca.position.set(-4.6, BASEY + 0.01, -3.2); cena.add(toca);
  bR(cena, 0x4f7a3c, 1.6, 1.4, 1.4, -5.2, BASEY + 0.7, -4.6, 0.4);
  const ninho = bR(cena, 0x9a8466, 0.6, 0.8, 0.6, -4.5, BASEY + 0.95, -4.1, 0.25);
  // fogueira e bandeira (vento soprando para +x)
  const FX = 7.5, FZ = 1.5;
  for (let i = 0; i < 4; i++) bR(cena, 0x5a3e2a, 1.6, 0.25, 0.25, FX, BASEY + 0.13, FZ, 0.05).rotation.y = i * Math.PI / 4;
  const chamas = [bR(cena, 0xe8743b, 0.7, 0.8, 0.7, FX, BASEY + 0.6, FZ, 0.15), bR(cena, 0xf4b24f, 0.4, 0.55, 0.4, FX, BASEY + 1.05, FZ, 0.12)];
  chamas.forEach((c) => { c.material = new THREE.MeshBasicMaterial({ color: c.material.color }); c.castShadow = false; });
  for (let i = 0; i < 7; i++) bR(cena, 0x7a7a72, 0.4, 0.3, 0.4, FX + Math.cos(i / 7 * 6.28) * 1.1, BASEY + 0.15, FZ + Math.sin(i / 7 * 6.28) * 1.1, 0.1);
  const fumaca = []; for (let i = 0; i < 9; i++) { const m = bR(cena, 0xd8d8d2, 0.7, 0.7, 0.7, 0, 0, 0, 0.3); m.material = M(0xd8d8d2, { transparent: true, opacity: 0.8 }); m.castShadow = false; fumaca.push(m); }
  const faiscas = []; for (let i = 0; i < 10; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), new THREE.MeshBasicMaterial({ color: 0xffb04a })); cena.add(m); faiscas.push(m); }
  const mastro = new THREE.Group(); mastro.position.set(3.2, BASEY, -4.4); cena.add(mastro);
  bR(mastro, 0x8a8a86, 0.15, 5, 0.15, 0, 2.5, 0, 0.04);
  const bandeira = []; for (let i = 0; i < 5; i++) { const m = bR(mastro, i % 2 ? 0xf2c12a : 0x24463a, 0.5, 0.9, 0.06, 0.3 + i * 0.48, 4.5, 0, 0.03); bandeira.push(m); }
  const ventos = []; for (let i = 0; i < 8; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.06, 0.06), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })); cena.add(m); ventos.push(m); }
  const barracaFumaca = barraca(0xe07a3a); cena.add(barracaFumaca);

  // ---------- beira do lago (x = 22) ----------
  const LX = 22, LZ = -27;
  const praia = bR(cena, 0xc9b07a, 20, 0.2, 6, LX, 0.0, LZ + 1, 0.2);
  const barracaMargem = barraca(0xe07a3a); cena.add(barracaMargem);
  const barracaLonge = barraca(0xe07a3a); cena.add(barracaLonge);
  const regua = new THREE.Group(); cena.add(regua);
  for (let i = 0; i < 12; i++) { const m = bR(regua, i % 2 ? 0xffffff : 0xf4b24f, 0.35, 0.08, 1.05, 0, 0.12, i * 1.05, 0.03); m.castShadow = false; }
  const mosquitos = []; for (let i = 0; i < 14; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshBasicMaterial({ color: 0x1a1a1a })); cena.add(m); mosquitos.push(m); }

  // ---------- galho seco e árvore sozinha (x = 45 e 70) ----------
  const GX = 45;
  const seca = arvore(GX, -4, 1.6, true);
  const galho = new THREE.Group(); galho.position.set(GX + 0.5, 6.2, -4); cena.add(galho);
  bR(galho, 0x8a7a6a, 4.2, 0.4, 0.4, 2.0, 0, 0, 0.1); bR(galho, 0x8a7a6a, 1.4, 0.25, 0.25, 3.2, 0.5, 0, 0.08).rotation.z = 0.6;
  const barracaGalho = barraca(0xe07a3a); cena.add(barracaGalho);
  const SX = 72;
  const sozinha = arvore(SX, -6, 1.7, false);
  const barracaRaio = barraca(0xe07a3a); cena.add(barracaRaio);
  const raio = new THREE.Group(); cena.add(raio);
  { let x = 0, y = 26; for (let i = 0; i < 6; i++) { const nx = x + (i % 2 ? 1.4 : -1.2), ny = y - 3.6; const len = Math.hypot(nx - x, ny - y);
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.45, len, 0.45), new THREE.MeshBasicMaterial({ color: 0xfff6b0, fog: false })); m.position.set((x + nx) / 2, (y + ny) / 2, 0); m.rotation.z = Math.atan2(nx - x, ny - y) * -1; raio.add(m); x = nx; y = ny; } }
  raio.position.set(SX + 0.5, 0, -6);
  const chuva = []; for (let i = 0; i < 70; i++) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.9, 0.04), new THREE.MeshBasicMaterial({ color: 0xcfe2ef, transparent: true, opacity: 0.75 })); cena.add(m); chuva.push({ m, x: rng(), y: rng(), z: rng() }); }

  // ---------- Desbravador ----------
  const desb = P.desbravador(); cena.add(desb);
  const matsD = []; desb.traverse((o) => { if (o.material && !matsD.includes(o.material)) matsD.push(o.material); });

  // ---------- climas ----------
  const CLIMA = {
