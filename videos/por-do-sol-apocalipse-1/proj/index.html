<script>
(function () {
  const S = STUDIO, P = PERSONAGENS, T = window.TEMPOS;
  THREE.ColorManagement.legacyMode = false;
  const $ = (id) => document.getElementById(id);
  const F = {}; for (const f of T.falas) F[f.id] = f;

  }

  for (let i = 0; i < 40; i++) { const b = bR(cena, 0xa3b26a, 0.5, 0.5, 0.5, (rng() - 0.5) * 50, 0.25, -7 + rng() * 30, 0.1); if (Math.abs(b.position.x) < 6 && b.position.z < 6) b.position.x += 12; }
  for (const [x, z, s] of [[-9, -4, 1.3], [10, -3, 1.5], [-14, 2, 1.1], [15, 4, 1.2]]) { const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s); cena.add(g); bR(g, 0x5a3e2a, 0.7, 4, 0.7, 0, 2, 0, 0.12); bR(g, 0x4f6a3c, 3.4, 2.4, 3.4, 0, 4.6, 0, 0.5); bR(g, 0x5c7a46, 2.4, 1.8, 2.4, 0.3, 6.0, 0.2, 0.45); }

  const jesus = P.jesus(), desb = P.desbravador(); FRENTE.add(jesus, desb);

  const coroa = new THREE.Group(); coroa.position.set(0, 2.45, 0); desb.userData.cabeca.add(coroa);
  bR(coroa, 0xe8c040, 2.1, 0.45, 2.1, 0, 0.1, 0, 0.08); for (const [x, z] of [[-0.85, 0.85], [0, 0.85], [0.85, 0.85], [-0.85, -0.85], [0.85, -0.85], [0, -0.85]]) bR(coroa, 0xe8c040, 0.38, 0.55, 0.38, x, 0.55, z, 0.08);

  const tchao = new THREE.Mesh(new THREE.PlaneGeometry(50, 40), M(0x9a8a62)); tchao.rotation.x = -Math.PI / 2; tchao.position.set(0, 0.03, -6); tchao.receiveShadow = true; tumulo.add(tchao);

  for (const [x, z] of [[-5, -2], [5, -3], [7, 0]]) { bR(tumulo, 0x6a8a46, 1.6, 1.2, 1.6, x, 0.6, z, 0.4); }
  const panos = bR(tumulo, 0xefe7dc, 1.6, 0.25, 0.6, 0.6, 0.4, -4.6, 0.1);

  // ---------- estrelas ----------
  { const r = S.rng(5); let h = ''; for (let i = 0; i < 80; i++) h += `<i style="left:${(r() * 1070) | 0}px;top:${(r() * 900) | 0}px;opacity:${(0.4 + r() * 0.6).toFixed(2)}"></i>`; $('estrelas').innerHTML = h; }

  // céu do pôr do sol avança com o tempo do vídeo (0 = dourado, 1 = noite chegando)
  const CEUS = [['#4f7aa8', '#e0a070', '#f6c47c'], ['#4a4a7a', '#d0705a', '#f2a060'], ['#24264a', '#7a4a72', '#d07a5a'], ['#14162e', '#3e2e56', '#8a5a5a']];
  function ceuPor(k) {
    const n = CEUS.length - 1, i = Math.min(n - 1, Math.floor(k * n)), f = k * n - i;
    return [0, 1, 2].map((j) => mixHex(CEUS[i][j], CEUS[i + 1][j], f));
  }

  // ---------- planos ----------
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const PL = [];
  const pl_ = (t, cl, de, para, oDe, oPara, foco, dof, costas) => PL.push({ t, clima: cl, de, para, olhaDe: oDe, olhaPara: oPara || oDe, foco: foco || V(0, 0, 0), dof: dof || 0, costas: !!costas });
  const dois = [V(0.6, 4.2, 17.6), V(0.45, 4.2, 17.0), V(0, 4.5, 0)];
  const closeJ = [V(-0.6, 4.3, 14.2), V(-0.7, 4.3, 13.85), V(JX, 5.9, 0)];
  const closeD = [V(1.0, 3.8, 13.7), V(1.1, 3.8, 13.35), V(DX, 5.5, 0)];

  P_(L(1) + 1.2, dois, 3);
  P_(L(2), closeJ);
  P_(L(3), closeD);
  P_(L(4), closeJ);
  P_(L(5), closeD);
  P_(L(6), closeJ);
  pl_(L(7), 'manha', V(TX - 4, 4.2, 22), V(TX - 3.2, 3.8, 18.5), V(TX + 1.6, 3.0, -4.5), V(TX + 1.6, 2.6, -4.5), V(TX, 0, -4));
  P_(L(8), closeD);
  P_(L(9), closeJ);
  costas(L(10), V(-1, 4.5, 27), V(-0.5, 4.2, 24.5), V(0, 7.0, -60));

  const bocaSuave = (q, t) => { let s = 0; for (let k = -6; k <= 0; k++) s += boca(q, t + k / T.fps); return s / 7; };
  const piscar = (t, f) => { const c = (t + f) % 3.9; return Math.max(0, 1 - Math.abs(c - 3.7) / 0.07); };
  const falaEm = (t) => T.falas.find((f) => t >= f.t0 - 0.05 && t <= f.t1 + 0.05);

  const TITULOS = [
    [W(4, 'fiel') - 0.1, LE(6) + 0.3, '1 DE 3', 'Fiel<br><b>Testemunha</b>'],
    [W(7, 'primogênito') - 0.1, LE(8) + 0.3, '2 DE 3', 'Primogênito<br>dos <b>mortos</b>'],
    [W(9, 'soberano') - 0.1, LE(9) + 0.3, '3 DE 3', 'Soberano dos<br><b>reis</b> da Terra'],
  ];
  const PRES = [W(11, 'três'), LE(14) + 0.4];
  const presItens = [['amor que não se esgota', W(12, 'primeiro')], ['libertação completa', W(13, 'segundo')], ['chamado real', W(14, 'terceiro')]];
  const LUZ = { t0: W(18, 'reflete'), t1: LE(18) + 0.3, itens: [['reflete a luz', W(18, 'reflete')], ['ama como foi amado', W(18, 'ama')], ['serve com alegria', W(18, 'serve')], ['compartilha a graça', W(18, 'compartilha')]] };

  const tmp = new THREE.Vector3();

      cena.fog.color.set(c[2]); hemi.color.set(mixHex('#f0d8c8', '#6a6aa0', kc)); hemi.groundColor.set(mixHex('#5a5a3a', '#2a2a2e', kc)); hemi.intensity = 1.05 - 0.45 * kc;

    const ombro = janela(t, L(19) - 0.8, S.D + 9, 0.6, 0.3);
    let dBD = null;
    if (gD > 0.3) dBD = { x: -0.3 * gD, z: 0.1 * gD, cx: -0.55 * gD, cz: 0 };
    const solta = seg(t, W(13, 'libertei'), 0.1);
    const coroaK = pop(t, W(14, 'rei'), 0.5) - seg(t, LE(16) + 0.3, 0.4, 'power2.in');
    const tocaCoroa = janela(t, L(15), LE(15), 0.25, 0.3);
    if (tocaCoroa > 0.01) dBD = { x: -2.6 * tocaCoroa, z: 0.4 * tocaCoroa, cx: -1.4 * tocaCoroa, cz: 0 };
    P.pose(desb, { andar: andando ? t * 2.4 : null, respirar: S.wave(t, 40), falar: bD, fase: t, piscar: piscar(t, 1.9),
      olhar: andando || virados ? 0 : -0.3, baixar: virados ? -0.05 : 0, inclinar: 0.1 * curioso, sobr: susto + 0.4 * curioso, arregalar: susto, bD: dBD });
    desb.rotation.y = virados ? Math.PI : (andando ? -0.8 : 0);
    if (virados && t > L(19) - 1) desb.position.x = S.mix(desb.position.x, 1.3, seg(t, L(19) - 0.8, 0.6));
    coroa.visible = coroaK > 0.01; coroa.scale.setScalar(Math.max(0.01, coroaK)); coroa.position.y = 2.45 + 1.2 * (1 - clamp(coroaK, 0, 1));
    corrente.visible = t > W(13, 'segundo') - 0.2 && t < W(13, 'libertei') + 1.6;
    elos.forEach(({ m, a }, i) => { const k = clamp((t - W(13, 'libertei')) / 1.2, 0, 1); m.position.set(Math.cos(a) * (1.25 + 3 * k), 1.85 + 2.2 * Math.sin(k * Math.PI) - 3 * k * k, Math.sin(a) * (0.85 + 3 * k)); m.rotation.x = k * 4 * (i % 2 ? 1 : -1); });
    if (!(t >= W(13, 'libertei'))) elos.forEach(({ m }) => { m.position.y = 1.85 + 0.05 * Math.sin(t * 3); });
    let jBD = null, jBE = null;
    const lado = Math.floor(t / 2.7) % 2;
    if (ombro > 0.01) jBD = { x: -0.25 * ombro, z: 1.15 * ombro, cx: -0.15 * ombro, cz: 0.1 * ombro };
    else if (gJ > 0.25) { const g = { x: -0.32 * gJ, z: 0.08 * gJ, cx: -0.6 * gJ, cz: 0 }; if (lado) jBD = g; else jBE = g; }
    if (virados && ombro > 0.01) { jBE = jBD; jBD = null; if (jBE) jBE = { x: jBE.x, z: jBE.z, cx: jBE.cx, cz: jBE.cz }; }
    P.pose(jesus, { respirar: S.wave(t, 42), falar: bJ, fase: t + 1, piscar: piscar(t, 0.4), olhar: virados ? 0 : 0.3, bD: jBD, bE: jBE });
    jesus.position.set(JX + (virados && ombro > 0.01 ? 0.25 : 0), 0, 0); jesus.rotation.y = virados ? Math.PI : 0;

    // ---------- túmulo ----------
    const rola = seg(t, W(7, 'vencer') - 0.2, 1.4, 'power2.inOut');
    pedra.position.set(S.mix(0.6, 3.8, rola), 2.0, -3.9); pedra.rotation.y = -rola * 1.6;
    panos.visible = rola > 0.5;

    // ---------- desenha ----------
    const naPraia = pl.clima !== 'manha';
    FRENTE.visible = naPraia;
    if (naPraia && pl.dof > 0) {
      for (const m of matsFrente) { m.colorWrite = false; m.depthWrite = false; }
      rFundo.render(cena, cam);
      for (const m of matsFrente) { m.colorWrite = true; m.depthWrite = true; }
      const outros = cena.children.filter((o) => o !== FRENTE && !o.isLight); outros.forEach((o) => { o.userData.v = o.visible; o.visible = false; });
      rFrente.render(cena, cam); outros.forEach((o) => { o.visible = o.userData.v; });
      $('frente').style.display = 'block';
    } else { rFundo.render(cena, cam); $('frente').style.display = 'none'; }

    // ---------- textos ----------
    const f = falaEm(t);
    let html = ''; if (f) { const c = f.chunks.find((c) => t >= c.t0 && t < c.t1); if (c) html = c.html; }
    if (html !== ultHtml) { legenda.innerHTML = html; ultHtml = html; }
    const fr = T.falas.find((x) => x.ref && t >= x.t0 - 0.1 && t <= x.t1 + 0.3);
    const refAtiva = fr ? fr.ref : null;
    if (refAtiva !== ultRef) { if (refAtiva) refTxt.textContent = refAtiva; ultRef = refAtiva; }
    const tit = TITULOS.find((x) => t >= x[0] && t < x[1]);
    mostra($('ref'), refAtiva && !tit ? pop(t, fr.t0 - 0.1, 0.3) : 0, 'translateX(-50%)');
    if ((tit ? tit[2] : null) !== ultTit) { if (tit) { $('tituloN').textContent = tit[2]; $('tituloQ').innerHTML = tit[3]; } ultTit = tit ? tit[2] : null; }
    mostra($('titulo'), tit ? pop(t, tit[0], 0.4) : 0);
    const presOn = t >= PRES[0] && t < PRES[1];
    if (presOn) { $('numero').textContent = '3'; $('rotulo').textContent = 'presentes da graça'; }
    mostra($('contador'), presOn ? pop(t, PRES[0], 0.35) : 0);
    let lista = null; if (presOn) lista = presItens; else if (t >= LUZ.t0 && t < LUZ.t1) lista = LUZ.itens;
    const chave = lista ? lista.map((x) => x[0]).join('|') : '';
    if (chave !== ultChips) { chipsEl.innerHTML = lista ? lista.map((x) => `<span class="chip">${x[0]}</span>`).join('') : ''; ultChips = chave; }
    if (lista) [...chipsEl.children].forEach((el, k) => { const t0 = lista[k][1]; mostra(el, pop(t, t0, 0.28)); el.classList.toggle('on', t >= t0 && t < t0 + 0.8); });
    chipsEl.style.top = presOn ? '480px' : '300px';
    let topo = 600;
    if (tit) topo = 640; if (presOn) topo = 790; if (!presOn && lista) topo = 300 + 80 * lista.length + 60;
    legenda.style.top = topo + 'px';
    const fimOn = t >= LE(22) + 0.3; mostra($('fim'), fimOn ? pop(t, LE(22) + 0.3, 0.6) : 0); if (fimOn) legenda.innerHTML = '';
  }, { loop: false });
})();
